name: Build MediaPipe with Bazel (ARM64)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-with-bazel:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Free Disk Space
      run: |
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/share/dotnet
        df -h
    
    - name: Install Bazelisk
      run: |
        wget https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
        chmod +x bazelisk-linux-amd64
        sudo mv bazelisk-linux-amd64 /usr/local/bin/bazel
        bazel --version
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          python3-dev \
          python3-pip \
          gcc-aarch64-linux-gnu \
          g++-aarch64-linux-gnu
        
        pip install numpy wheel setuptools
    
    - name: Clone MediaPipe
      run: |
        git clone https://github.com/google/mediapipe.git
        cd mediapipe
        git checkout v0.10.14
    
    - name: Configure Bazel for ARM64
      run: |
        cd mediapipe
        cat > .bazelrc.local <<EOF
        build --crosstool_top=@bazel_tools//tools/cpp:toolchain
        build --cpu=aarch64
        build --host_cpu=k8
        EOF
    
    - name: Build Python package
      run: |
        cd mediapipe
        
        # Opción 1: Build directo con setup.py
        export MEDIAPIPE_DISABLE_GPU=1
        python setup.py gen_protos
        python setup.py bdist_wheel
        
      continue-on-error: true
    
    - name: Alternative build with pip
      if: failure()
      run: |
        cd mediapipe
        pip wheel . --no-deps -w ../wheels
      continue-on-error: true
    
    - name: List artifacts
      run: |
        echo "=== Checking for wheels ==="
        find . -name "*.whl" -type f
        ls -lh mediapipe/dist/*.whl 2>/dev/null || echo "No dist wheels"
        ls -lh wheels/*.whl 2>/dev/null || echo "No wheels directory"
    
    - name: Upload wheels
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: mediapipe-wheels
        path: |
          mediapipe/dist/*.whl
          wheels/*.whl
          **/*.whl
        retention-days: 30
        if-no-files-found: warn
    
    - name: Create Release
      if: success() && github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v0.10.14-arm64-${{ github.run_number }}
        name: MediaPipe v0.10.14 ARM64
        body: |
          MediaPipe compiled for ARM64 (Termux compatible)
          
          Installation:
          ```bash
          pip install mediapipe-*.whl
          ```
        files: |
          mediapipe/dist/*.whl
          wheels/*.whl
        fail_on_unmatched_files: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}            fi && \
            pip wheel . -w /workspace/wheels --no-deps || \
            python setup.py bdist_wheel && \
            cp dist/*.whl /workspace/wheels/ 2>/dev/null || true
          "
    
    - name: List built wheels
      run: |
        ls -lh wheels/ || ls -lh mediapipe/dist/ || echo "No wheels found"
    
    - name: Upload wheels
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: mediapipe-arm64-wheels
        path: |
          wheels/*.whl
          mediapipe/dist/*.whl
        retention-days: 30
        if-no-files-found: warn
    
    - name: Create Release
      if: github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: build-${{ github.run_number }}
        name: MediaPipe ARM64 Build ${{ github.run_number }}
        files: |
          wheels/*.whl
          mediapipe/dist/*.whl
        fail_on_unmatched_files: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}        export AR=aarch64-linux-gnu-ar
        export RANLIB=aarch64-linux-gnu-ranlib
        export LD=aarch64-linux-gnu-ld
        
        # Intentar build con platform específica
        python setup.py bdist_wheel --plat-name=linux_aarch64 || \
        python setup.py bdist_wheel --plat-name=manylinux2014_aarch64 || \
        python setup.py bdist_wheel
        
        # Mostrar lo que se generó
        ls -lh dist/
        
    - name: Upload wheel artifact
      uses: actions/upload-artifact@v4
      with:
        name: mediapipe-wheel
        path: mediapipe/dist/*.whl
        retention-days: 30
    
    - name: Create Release
      if: github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.0-termux
        name: MediaPipe for Termux ARM64
        files: mediapipe/dist/*.whl
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
