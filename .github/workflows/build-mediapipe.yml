name: Build MediaPipe Simple (Docker)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-in-docker:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64
    
    - name: Build MediaPipe in ARM64 container
      run: |
        docker run --platform linux/arm64 --rm \
          -v $PWD:/workspace \
          arm64v8/python:3.10-slim \
          bash -c "
            apt-get update && \
            apt-get install -y build-essential cmake git wget && \
            pip install --upgrade pip && \
            pip install wheel setuptools numpy && \
            cd /workspace && \
            git clone --depth 1 --branch v0.10.14 https://github.com/google/mediapipe.git && \
            cd mediapipe && \
            # Arreglar version si es necesario
            if grep -q \"version = 'dev'\" setup.py; then \
              sed -i \"s/version = 'dev'/version = '0.10.14'/\" setup.py; \
            fi && \
            pip wheel . -w /workspace/wheels --no-deps || \
            python setup.py bdist_wheel && \
            cp dist/*.whl /workspace/wheels/ 2>/dev/null || true
          "
    
    - name: List built wheels
      run: |
        ls -lh wheels/ || ls -lh mediapipe/dist/ || echo "No wheels found"
    
    - name: Upload wheels
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: mediapipe-arm64-wheels
        path: |
          wheels/*.whl
          mediapipe/dist/*.whl
        retention-days: 30
        if-no-files-found: warn
    
    - name: Create Release
      if: github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: build-${{ github.run_number }}
        name: MediaPipe ARM64 Build ${{ github.run_number }}
        files: |
          wheels/*.whl
          mediapipe/dist/*.whl
        fail_on_unmatched_files: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}        export AR=aarch64-linux-gnu-ar
        export RANLIB=aarch64-linux-gnu-ranlib
        export LD=aarch64-linux-gnu-ld
        
        # Intentar build con platform específica
        python setup.py bdist_wheel --plat-name=linux_aarch64 || \
        python setup.py bdist_wheel --plat-name=manylinux2014_aarch64 || \
        python setup.py bdist_wheel
        
        # Mostrar lo que se generó
        ls -lh dist/
        
    - name: Upload wheel artifact
      uses: actions/upload-artifact@v4
      with:
        name: mediapipe-wheel
        path: mediapipe/dist/*.whl
        retention-days: 30
    
    - name: Create Release
      if: github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.0-termux
        name: MediaPipe for Termux ARM64
        files: mediapipe/dist/*.whl
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
